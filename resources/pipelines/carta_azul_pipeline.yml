# API-shaped pipeline specification; this file alone does not deploy resources.
# Convert YAML to JSON for POST /api/2.0/pipelines (create) or
# PUT /api/2.0/pipelines/{pipeline_id} (update).
# Map the repository root to a private Databricks Workspace Files folder and
# this workspace uses /Workspace/Users/a01352461@tec.mx/CartaAzul.
# Helpers _common.py and _schemas.py must also be uploaded under silver/.
# root_path makes the silver package importable; only entry points are libraries.
# Manual historical batch: no schedule, no continuous ingestion.
name: carta_azul_historical_pipeline
catalog: workspace
schema: applebees
serverless: true
edition: ADVANCED
channel: current
continuous: false
development: false
root_path: /Workspace/Users/a01352461@tec.mx/CartaAzul/src/transformations
libraries:
  - file:
      path: /Workspace/Users/a01352461@tec.mx/CartaAzul/src/transformations/silver/mv_checks.py
  - file:
      path: /Workspace/Users/a01352461@tec.mx/CartaAzul/src/transformations/silver/mv_reference_dimensions.py
  - file:
      path: /Workspace/Users/a01352461@tec.mx/CartaAzul/src/transformations/silver/mv_payments.py
  - file:
      path: /Workspace/Users/a01352461@tec.mx/CartaAzul/src/transformations/silver/mv_discounts.py
  - file:
      path: /Workspace/Users/a01352461@tec.mx/CartaAzul/src/transformations/silver/mv_quality_issues.py
  - file:
